compatibility = "PXTE v3 additively embeds one byte-exact optional PXTE v2 Loop/Thread body and fixes bounded ProcessDomain and Process Mailbox desired records, exact profile identities and digests, resource/lifecycle/restart declarations, no-replay invocation requirements, canonical ordering, composite digest framing, and stable rejection codes. PXAR v4 strictly frames one unchanged signed envelope, PXTA v1, and PXTE v3 with no older-version fallback. These are desired-state and wire contracts only; profile references do not prove OS sandbox or resource enforcement. Incompatible framing, digest, eligibility, or scope changes require new explicit versions and domains."
tests = ["crates/paraegox-runtime-contracts/src/process_execution.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s6_runtime_process_execution_request.py", "tests/fixtures/wire/s6_runtime_apply_request_v4.json"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::process_protocol"
symbols = ["PROCESS_WORKER_PROTOCOL_MAGIC", "PROCESS_WORKER_PROTOCOL_VERSION", "PROCESS_WORKER_HEADER_BYTES", "MAX_PROCESS_WORKER_FRAME_BYTES", "MAX_PROCESS_WORKER_PAYLOAD_BYTES", "MAX_PROCESS_WORKER_CREDITS", "MAX_PROCESS_WORKER_RETAINED_BYTES", "ProcessSessionGenerations", "ProcessSessionIdentity", "ProcessFrameDirection", "ProcessWorkerState", "ProcessFrameKind", "ConstructOutcome", "InvocationTerminalKind", "StopReason", "StoppedOutcome", "ProcessFrameBody", "ProcessFrame", "ProcessTerminalParts", "ProcessProtocolPhase", "ProcessProtocolSession", "ProcessProtocolErrorCode", "ProcessProtocolError"]
owner = "Runtime Process worker protocol owner"
consumers = ["paraegox-runtime", "paraegox-sdk reference worker"]
compatibility = "PXWP v1 fixes the canonical frame, exact live-generation identity fence, direction and phase rules, per-direction sequencing, Invoke/Invoked acknowledgement, bounded credits and retained-byte accounting, heartbeat snapshots, cancellation, terminal results, and stable error codes. It does not define process spawning, OS containment, Runtime readiness, replay, or recovery policy. Incompatible framing or session semantics require a new protocol version."
tests = ["crates/paraegox-runtime-contracts/src/process_protocol.rs", "tests/contract/test_s6_process_worker_protocol.py", "tests/unit/test_s6_python_worker_protocol.py", "tests/fixtures/wire/s6_process_worker_protocol_v1.json"]

[[registry.public_apis]]
module = "paraegox_runtime::host_watchdog"
symbols = ["HOST_WATCHDOG_PROTOCOL_MAGIC", "HOST_WATCHDOG_PROTOCOL_VERSION", "HOST_WATCHDOG_FRAME_BYTES", "HOST_WATCHDOG_ENABLE_ENV", "HOST_WATCHDOG_GENERATION_ENV", "HOST_WATCHDOG_HEARTBEAT_MILLIS_ENV", "HOST_WATCHDOG_HANDSHAKE_MILLIS_ENV", "HostWatchdogGeneration", "HostWatchdogSequence", "HostControlProbeNonce", "HostBootstrapPhase", "HostWatchdogDirection", "HostWatchdogFrameBody", "HostWatchdogFrame", "HostWatchdogProtocolErrorCode", "HostWatchdogProtocolError"]
owner = "RuntimeHost watchdog contract owner"
consumers = ["paraegox-runtime", "paraegox-runtime-host"]
compatibility = "PXHW v1 fixes one strict 40-byte big-endian frame with magic/version, nonzero exact child generation, direction-local nonzero sequence, ordered bootstrap progress, running heartbeat, exact control probe/ack nonce, zero reserved bytes, and stable decode reason codes. The inherited stream binds the adapter to its spawned child; these frames are external reactor-progress observations only and cannot claim Card readiness, ProcessDomain terminal state, effect outcome, or a recovery receipt. Incompatible framing or semantics require a new explicit protocol version."
tests = ["crates/paraegox-runtime/src/host_watchdog.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]

[[registry.public_apis]]
module = "paraegox_runtime"
symbols = ["run_runtime_host_process", "RuntimeHostProcessError"]
owner = "RuntimeHost process owner"
consumers = ["paraegox-runtime-host"]
compatibility = "This pre-1.0 executable bootstrap surface owns one current-thread reactor, Ctrl-C/TERM structured shutdown, and an optional explicit PXHW endpoint whose heartbeat and control acknowledgement run on that reactor. With no complete watchdog environment profile it retains the standalone idle behavior; an explicitly enabled incomplete/invalid profile fails closed. It exposes no Tokio type, apply endpoint, Card runner, readiness claim, external restart action, or durable state."
tests = ["crates/paraegox-runtime/src/runtime_host.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]

[[registry.public_apis]]
module = "paraegox_runtime_host::service_manager"
symbols = ["HostWatchdogTiming", "HostTerminationTiming", "HostRestartPolicy", "RuntimeHostServiceManagerPolicy", "RuntimeHostLaunch", "ServiceManagerFailure", "ServiceManagerEvidenceKind", "ServiceManagerEvidence", "RuntimeHostServiceManagerState", "RuntimeHostServiceManagerSnapshot", "RuntimeHostServiceManager", "ServiceManagerError"]
owner = "External RuntimeHost lifecycle owner"
consumers = ["POSIX OS service-manager profiles", "external RuntimeHost system harness"]
compatibility = "This internal P2d reference adapter owns one exact RuntimeHost process group and the only restart-window/backoff/quarantine mutation ledger. The restart window counts actual replacement spawn attempts rather than pending schedules. Reaped/restart requires both direct-child reap and exact PGID absence, including TERM-ignoring same-group descendants; every OS-created child consumes a unique generation, and post-spawn setup cleanup failure retains the sole process owner and quarantines without replacement. The reference executable keeps that quarantine in a signal-responsive owner loop, with synchronous Drop retained only as the final fail-safe. Its fixed-capacity evidence records external observations and process actions, never Runtime/ProcessDomain receipts. The proof does not cover ProcessDomain workers deliberately launched into distinct process groups if RuntimeHost is uncatchably killed; production orphan cleanup needs a shared cgroup/job object or durable external ownership journal. It intentionally exposes no NodeDaemon/Node facts, Deployment input, arbitrary shell/environment launch, or second recovery-action owner; wider platform service-manager integration may replace this POSIX reference behind equivalent contract evidence."
tests = ["crates/paraegox-runtime-host/src/service_manager.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]

[cargo]
manifest_path = "Cargo.toml"
lockfile_path = "Cargo.lock"
crate_root = "crates"

[[cargo.rules]]
id = "CARGO-ARCH-001"
source = "paraegox-kernel"
allow_workspace_dependencies = []
allow_external_dependencies = ["sha2"]

[[cargo.rules]]
id = "CARGO-ARCH-002"
source = "paraegox-runtime-contracts"
allow_workspace_dependencies = ["paraegox-kernel"]
allow_external_dependencies = []

[[cargo.rules]]
id = "CARGO-ARCH-003"
source = "paraegox-runtime"
allow_workspace_dependencies = ["paraegox-kernel", "paraegox-runtime-contracts"]
allow_external_dependencies = ["ed25519-dalek", "nix", "tokio"]

[[cargo.rules]]
id = "CARGO-ARCH-004"
source = "paraegox-deployment"
allow_workspace_dependencies = ["paraegox-kernel", "paraegox-runtime-contracts"]
allow_external_dependencies = ["ed25519-dalek"]

[[cargo.rules]]
id = "CARGO-ARCH-005"
source = "paraegox-runtime-host"
allow_workspace_dependencies = ["paraegox-runtime"]
allow_external_dependencies = ["nix", "tokio"]

[[architecture.rules]]
id = "ARCH-001"
source = "paraegox.kernel"
forbid = [
  "paraegox.decks",
  "paraegox.deployment",
  "paraegox.drivers",
  "paraegox.gateways",
  "paraegox.runtime",
  "paraegox.services",
]
reason = "Kernel mechanisms must not depend on product, deployment, runtime, gateway, driver, or service owners."

[[architecture.rules]]
id = "ARCH-002"
source = "paraegox.runtime"
forbid = ["paraegox.decks", "paraegox.deployment"]
reason = "Runtime consumes runtime-owned apply contracts and must not import deployment or Deck implementation."

[[terminology.rules]]
id = "TERM-001"
identifier = "ModuleSpec"
replacement = "CardDefinition"
reason = "ADR-0002 accepts CardDefinition as the reusable capability contract."

[[terminology.rules]]
id = "TERM-002"
identifier = "ModuleRef"
replacement = "CardDefinitionRef"
reason = "ADR-0002 accepts CardDefinitionRef as the stable reference."

[[terminology.rules]]
id = "TERM-003"
identifier = "ApplicationTopology"
replacement = "DeckTopology"
reason = "DeckTopology is the proposed workload topology term; Application is not a current identity."

[[terminology.rules]]
id = "TERM-004"
identifier = "RemoteDomain"
replacement = "target RuntimeHost placement"
reason = "ExecutionDomain is local to RuntimeHost; remote placement is not a local domain."

[[terminology.rules]]
id = "TERM-005"
identifier = "LocalBus"
replacement = "PortBinding test fixture or Zenoh-backed PortBinding"
reason = "There is one production Fabric and no parallel local production bus."

[[terminology.rules]]
id = "TERM-006"
identifier = "MemoryBus"
replacement = "PortBinding test fixture"
reason = "A test fixture must not become a second public Bus product."

[[terminology.rules]]
id = "TERM-007"
identifier = "MemoryPortBinding"
replacement = "PortBinding test fixture"
reason = "Test implementations do not create a second public live-binding term."

[[terminology.rules]]
id = "TERM-008"
identifier = "ZenohBinding"
replacement = "PortBinding"
reason = "PortBinding is the only public live-binding term."
