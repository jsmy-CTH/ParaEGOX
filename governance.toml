schema_version = 1

[repository]
source_root = "src/paraegox"
term_scan_roots = ["src", "crates", "configs"]
exception_scan_roots = ["src", "crates", "tests", "scripts", ".github"]
documentation_roots = ["README.md", "README_zh.md"]
untracked_only_roots = ["docs"]
allowed_top_level_directories = [".github", "configs", "crates", "docs", "scripts", "src", "tests"]
ignored_top_level_directories = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "__pycache__", "build", "dist", "target"]

[registry]
# Do not add placeholders. Add rows only in the same change that creates the real surface.
deprecations = []
feature_flags = []

[[registry.waivers]]
id = "GOV-WAIVER-0001"
rule_id = "rust:expect"
scope = "crates/paraegox-runtime/src/lib.rs"
owner = "Runtime apply admission and state owner"
reason = "Keep the admitted B2/P2a state mechanisms, S4/P2b Loop composition, S5/P2c ThreadDomain/ExecutorBudget composition, and fixed two-CoreService lifecycle evidence private until the P2e Runtime apply endpoint and assembly owner become their executable consumer. The binary consumes only the reactor/task/clock bootstrap, while canonical component and fixed lifecycle composition remain L2 evidence; remove or narrow this expectation in P2e."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0002"
rule_id = "rust:expect"
scope = "crates/paraegox-deployment/src/lib.rs"
owner = "Deployment projection and apply-envelope owner"
reason = "Keep the tested canonical request producer private until the P2e DeploymentController becomes its admitted executable owner; remove the expectation in that bounded batch."
expires_at = "2026-09-30"

[[registry.packages]]
path = "crates/paraegox-kernel"
cargo_package = "paraegox-kernel"
owner = "Kernel mechanisms"
responsibility = "Canonical digest framing, identity values, and owner-local monotonic time values shared by admitted mechanism owners."
status = "public"
public_entrypoints = ["paraegox_kernel::digest", "paraegox_kernel::identity", "paraegox_kernel::time"]
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
first_tests = ["crates/paraegox-kernel/src/digest.rs", "crates/paraegox-kernel/src/identity.rs", "crates/paraegox-kernel/src/time.rs"]
removal_condition = "Removal requires migrating every registered mechanism consumer and its canonical digest, identity, or time evidence."

[[registry.packages]]
path = "crates/paraegox-runtime-contracts"
cargo_package = "paraegox-runtime-contracts"
owner = "Runtime contract owner"
responsibility = "Source-plan provenance, canonical PXTA binding assignments, canonical PXTE v1 Loop and additive PXTE v2 Loop+Thread inbound-Mailbox assignments, v2/v3 composite target digests, complete PXAR v1/v2/v3 Runtime apply requests, B1 apply-control commitments, writer-tenure signing and fingerprints, temporal constraints, and the canonical B2 signed apply-envelope wire contract; this package does not model a general execution plan or source-only Cards with no input Mailbox."
status = "public"
public_entrypoints = ["paraegox_runtime_contracts::assignment", "paraegox_runtime_contracts::execution", "paraegox_runtime_contracts::thread_execution", "paraegox_runtime_contracts::provenance", "paraegox_runtime_contracts::apply", "paraegox_runtime_contracts::temporal", "paraegox_runtime_contracts::wire"]
consumers = ["paraegox-deployment", "paraegox-runtime"]
first_tests = ["crates/paraegox-runtime-contracts/src/assignment.rs", "crates/paraegox-runtime-contracts/src/execution.rs", "crates/paraegox-runtime-contracts/src/thread_execution.rs", "crates/paraegox-runtime-contracts/src/provenance.rs", "crates/paraegox-runtime-contracts/src/apply.rs", "crates/paraegox-runtime-contracts/src/temporal.rs", "crates/paraegox-runtime-contracts/src/wire.rs", "tests/contract/test_s5_runtime_thread_execution_request.py"]
removal_condition = "Removal requires replacing both the independent Deployment producer and Runtime consumer in one accepted contract migration."

[[registry.packages]]
path = "crates/paraegox-runtime"
cargo_package = "paraegox-runtime"
owner = "Runtime apply admission and state owner"
responsibility = "Signed-request admission and apply-control transitions, bounded Mailbox and PortBinding, the current-thread RuntimeHost reactor and structured task owner, S4 LoopDomain dispatch, and S5 RuntimeHost-owned ExecutorBudget/ThreadDomain with fixed workers, permit-before-dequeue, signed timeout fencing, wedged capacity retention, joined-worker proof, and private single-subject trusted synchronous Card composition; it also contains a private fixed provider-consumer two-CoreService lifecycle owner. These L2 paths are not yet consumed by an apply endpoint, native-pool adapters remain fail-closed, and the trusted Card factory plus pre-install failure Drop remain finite same-build synchronous assumptions until P2e. This package has no ProcessDomain, durable journal, Fabric, Controller, or full RuntimeAssemblyEngine."
status = "experimental"
public_entrypoints = ["paraegox_runtime::run_runtime_host_process"]
consumers = ["paraegox-runtime-host"]
first_tests = ["crates/paraegox-runtime/src/admission.rs", "crates/paraegox-runtime/src/apply_state.rs", "crates/paraegox-runtime/src/request.rs", "crates/paraegox-runtime/src/mailbox.rs", "crates/paraegox-runtime/src/port_binding.rs", "crates/paraegox-runtime/src/runtime_clock.rs", "crates/paraegox-runtime/src/task_registry.rs", "crates/paraegox-runtime/src/dispatcher.rs", "crates/paraegox-runtime/src/loop_domain.rs", "crates/paraegox-runtime/src/card_instance.rs", "crates/paraegox-runtime/src/card_executor.rs", "crates/paraegox-runtime/src/component_runtime.rs", "crates/paraegox-runtime/src/thread_component_runtime.rs", "crates/paraegox-runtime/src/executor_budget.rs", "crates/paraegox-runtime/src/thread_domain.rs", "crates/paraegox-runtime/src/thread_registry.rs", "crates/paraegox-runtime/src/core_service.rs", "crates/paraegox-runtime/src/runtime_host.rs"]
removal_condition = "Removal requires replacing the executable consumer and the proven canonical-request to bounded LoopDomain ownership path without adding a second desired-state, task, or payload-queue owner."

[[registry.packages]]
path = "crates/paraegox-runtime-host"
cargo_package = "paraegox-runtime-host"
owner = "RuntimeHost process owner"
responsibility = "Minimal executable composition root for the single RuntimeHost reactor and process shutdown signal; S5 adds only crate-private root ownership and cleanup evidence for planned ThreadDomains, while the public process remains idle and owns no Deployment planning, apply input, Card configuration, Fabric, or persistence."
status = "internal"
public_entrypoints = []
consumers = []
first_tests = ["crates/paraegox-runtime/src/runtime_host.rs"]
removal_condition = "Remove only when another admitted OS-managed executable becomes the sole RuntimeHost reactor composition root."

[[registry.packages]]
path = "crates/paraegox-deployment"
cargo_package = "paraegox-deployment"
owner = "Deployment projection and apply-envelope owner"
responsibility = "Pure projection from committed deployment identities and canonical target assignments plus Loop/Thread execution plans into complete Runtime slices and signature-independent PXAR v1/v2/v3 apply-request drafts; signing keys and I/O remain caller-owned."
status = "enabler"
public_entrypoints = []
consumers = []
first_tests = ["crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs"]
removal_condition = "Remove or restructure this enabler if the P2e DeploymentController cannot reuse the P2a-proven canonical projection/request path without a parallel producer."

[[registry.public_apis]]
module = "paraegox_kernel::digest"
symbols = ["Digest32", "DigestBuildError", "Digest32Builder"]
owner = "Kernel mechanisms"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "The SHA-256-v1 framing and golden bytes are stable; semantic domains remain contract-owned and versioned."
tests = ["crates/paraegox-kernel/src/digest.rs"]

[[registry.public_apis]]
module = "paraegox_kernel::identity"
symbols = ["RuntimeHostId", "PrincipalRef"]
owner = "Kernel identity values"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "Types stay opaque and non-interchangeable; their 16-byte values are stable in explicitly registered B2 envelope fields without defining a global serializer beyond those fields."
tests = ["crates/paraegox-kernel/src/identity.rs"]

[[registry.public_apis]]
module = "paraegox_kernel::time"
symbols = ["ClockDomainRef", "ClockGeneration", "BoundedDuration", "MonotonicInstant", "ClockReading", "MonotonicDeadline", "TimeError"]
owner = "Kernel time values"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "ClockDomainRef's 16-byte value, nonzero ClockGeneration, and nanosecond BoundedDuration are stable where embedded by B2 wire v1; MonotonicInstant, ClockReading, and MonotonicDeadline remain owner-local and are not serialized as protocol time."
tests = ["crates/paraegox-kernel/src/time.rs"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::assignment"
symbols = ["TARGET_ASSIGNMENTS_VERSION", "MAX_TARGET_ASSIGNMENTS", "MAX_TARGET_ASSIGNMENTS_BYTES", "RUNTIME_APPLY_REQUEST_VERSION", "MAX_RUNTIME_APPLY_REQUEST_BYTES", "BindingId", "InstanceRef", "PortRef", "MailboxRef", "SchemaRef", "PortDirection", "InteractionKind", "PortCardinality", "PortSpec", "OverflowPolicy", "DeliveryProfile", "MailboxSpec", "PortEndpoint", "BindingAssignment", "TargetAssignments", "RuntimePlanSlice", "RuntimeApplyRequest", "AssignmentContractError", "AssignmentWireErrorCode", "AssignmentWireError", "RequestWireErrorCode", "RequestWireError"]
owner = "Runtime canonical assignment and complete-request contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "PXTA v1 fixes the big-endian 256-byte static 1:1 binding record, BindingId ordering, exact schema identity/version/digest, duplicate rejection, bounds, enum values, assignment digest domain, and stable error codes; PXAR v1 fixes the bounded outer framing of one unchanged B2 envelope plus its canonical assignment body, without creating a second signature or request digest. Incompatible changes require a new protocol version."
tests = ["crates/paraegox-runtime-contracts/src/assignment.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s3_runtime_apply_request.py"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::provenance"
symbols = ["RUNTIME_SLICE_HEADER_VERSION", "PlanProvenance", "RuntimeSliceHeader", "RuntimeSliceCommitment", "SourceScopeRef", "SourcePlanRef", "SourcePlanRevision", "SourcePlanDigest", "TargetAssignmentDigest", "TargetSliceDigest", "ProvenanceContractError"]
owner = "Runtime contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "The B1 header version, target-slice digest framing, and golden outputs remain stable; B2 envelope v1 canonically carries their semantic fields and derived digests, while Rust layout remains non-ABI."
tests = ["crates/paraegox-runtime-contracts/src/provenance.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-runtime/src/apply_state.rs"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::apply"
symbols = ["WRITER_TENURE_SIGNING_TRANSCRIPT_VERSION", "MAX_TENURE_NONCE_BYTES", "MAX_TENURE_SIGNATURE_BYTES", "MAX_TENURE_SIGNING_TRANSCRIPT_BYTES", "PlanWriterRef", "ApplyOperationId", "TenureAuthorityRef", "TenureKeyRef", "PlanWriterEpoch", "TenureProofAlgorithm", "TenureProofAuthority", "WriterTenureClaim", "WriterTenureSigningTranscript", "WriterTenureProof", "TenureProofError", "PlanWriterContext", "ExpectedActive", "RuntimeApplyControl", "RuntimeApplyControlCommitment", "ApplyContractError"]
owner = "Runtime contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "The B1 exact target-slice CAS, proof-envelope fingerprint including its signature, apply-control v1 digest framing, and golden outputs remain stable; writer-tenure signing-transcript v1 and its bounds are published and exclude the signature, while B2 envelope compatibility is governed by the wire module."
tests = ["crates/paraegox-runtime-contracts/src/apply.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "crates/paraegox-runtime/src/apply_state.rs", "tests/contract/test_s2_apply_vectors.py"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::temporal"
symbols = ["APPLY_TEMPORAL_CONSTRAINT_VERSION", "TemporalConstraintId", "ApplyTemporalConstraint", "TemporalContractError"]
owner = "Runtime contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "Version 1 fixes the constraint identity, target clock domain and generation, and original and remaining nanosecond budgets; remaining budget may only attenuate, while local monotonic instants and deadlines are never transported."
tests = ["crates/paraegox-runtime-contracts/src/temporal.rs", "crates/paraegox-runtime-contracts/src/wire.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s2_apply_vectors.py"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::wire"
symbols = ["RUNTIME_APPLY_ENVELOPE_VERSION", "APPLY_REQUEST_SIGNING_TRANSCRIPT_VERSION", "MAX_RUNTIME_APPLY_ENVELOPE_BYTES", "MAX_APPLY_AUTH_NONCE_BYTES", "MAX_APPLY_AUTH_SIGNATURE_BYTES", "ApplyAuthKeyRef", "ApplyAuthAlgorithm", "ApplyRequestAuthClaim", "ApplyRequestAuthentication", "ApplyRequestSigningTranscript", "RuntimeApplyEnvelopeDraft", "RuntimeApplyEnvelope", "ApplyAuthError", "EnvelopeContractError", "WireErrorCode", "WireError"]
owner = "Runtime contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "Version 1 fixes the magic, 37 ordered TLVs, big-endian scalar and length encoding, frame, nonce, and signature bounds, the 36-field request-signing transcript excluding only the request signature, request-digest framing, and stable WireErrorCode values; incompatible changes require a new protocol version."
tests = ["crates/paraegox-runtime-contracts/src/wire.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s2_apply_vectors.py"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::execution"
symbols = ["TARGET_EXECUTION_PLAN_VERSION", "RUNTIME_APPLY_REQUEST_V2_VERSION", "MAX_LOOP_DOMAINS", "MAX_MAILBOX_EXECUTIONS", "MAX_DOMAIN_OUTSTANDING", "MAX_SERVICE_COST_TOKENS", "MAX_MINIMUM_SERVICE_WEIGHT", "MAX_ARRIVALS_PER_WINDOW", "MAX_EXECUTION_DURATION_NANOS", "MAX_TARGET_EXECUTION_PLAN_BYTES", "MAX_RUNTIME_APPLY_REQUEST_V2_BYTES", "DomainRef", "CardDefinitionRef", "CardImplementationRef", "TargetExecutionDigest", "CallModel", "WorkloadKind", "BlockingRisk", "RunBoundProvenance", "DispatchClass", "OverrunAction", "LoopDomainCapacity", "LoopLifecycleBudgets", "LoopDomainSpec", "CardSubjectSpec", "LoopExecutionRequirements", "CallbackBudgets", "MailboxDispatchPolicy", "MailboxExecutionSpec", "TargetExecutionPlan", "TargetPlanAssignments", "RuntimePlanSliceV2", "RuntimeApplyRequestV2", "ExecutionContractError", "TargetPlanContractError", "ExecutionRecordSection", "ExecutionWireErrorCode", "ExecutionWireError", "TargetPlanWireErrorCode", "RequestV2WireErrorCode", "RequestV2WireError"]
owner = "Runtime execution contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "PXTE v1 fixes bounded big-endian 64-byte LoopDomain and 236-byte Mailbox execution records, canonical ordering, enum values, digest framing, bounds, and stable rejection codes for the inbound-Mailbox-driven Loop-eligible subset. PXAR v2 strictly frames one unchanged signed envelope, one PXTA v1 body, and one PXTE v1 body with three explicit lengths and no v1/v2 fallback; its explicit v2 composite digest commits the PXTA and PXTE digests through the existing Slice assignment-digest field. PXTA may be a superset, but records absent from PXTE remain execution-inert and grant no CardInstance, LoopDomain, callback, dispatcher, or Task authority. Loop admission requires cooperative async I/O or routing, no blocking risk, measured or certified run bounds, CooperativeCancel or Escalate overrun handling, total arrivals-times-(run-plus-cleanup) utilization within the common capacity window, control utilization within reserved capacity, and a strict scheduler-independent Control start bound derived across the signed PXTA/PXTE plan. MailboxExecutionSpec introduces subjects only for this inbound-Mailbox-driven subset: source-only Cards with no input Mailbox are not expressible, so these types are not a general or complete execution-plan contract. Incompatible framing, digest, eligibility, or scope changes require new explicit versions and domains."
tests = ["crates/paraegox-runtime-contracts/src/execution.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s4_runtime_execution_request.py", "tests/fixtures/wire/s4_runtime_apply_request_v2.json"]

[[registry.public_apis]]
module = "paraegox_runtime_contracts::thread_execution"
symbols = ["TARGET_EXECUTION_PLAN_V2_VERSION", "RUNTIME_APPLY_REQUEST_V3_VERSION", "MAX_THREAD_DOMAINS", "MAX_THREAD_MAILBOX_EXECUTIONS", "MAX_EXECUTOR_THREADS", "MAX_TARGET_EXECUTION_PLAN_V2_BYTES", "MAX_RUNTIME_APPLY_REQUEST_V3_BYTES", "ThreadDomainRef", "TargetExecutionDigestV2", "ExecutorBudgetSpec", "ThreadDomainSpec", "ThreadInvocationBudgets", "ThreadExecutionRequirements", "ThreadDispatchPolicy", "ThreadMailboxExecutionSpec", "TargetExecutionPlanV2", "TargetPlanAssignmentsV3", "RuntimePlanSliceV3", "RuntimeApplyRequestV3", "ThreadExecutionContractError", "TargetPlanV3ContractError", "ThreadExecutionRecordSection", "ThreadExecutionWireErrorCode", "ThreadExecutionWireError", "TargetPlanV3WireErrorCode", "RequestV3WireErrorCode", "RequestV3WireError"]
owner = "Runtime Thread execution contract owner"
consumers = ["paraegox-deployment", "paraegox-runtime"]
compatibility = "PXTE v2 additively embeds one byte-exact optional PXTE v1 Loop body and fixes bounded big-endian ThreadDomain and Thread Mailbox records, global framework/worker/distinct-instance-native budgeting, utilization, exact PXTA references, Loop/Thread identity separation, canonical ordering, digest framing, and stable rejection codes. PXAR v3 strictly frames one unchanged signed envelope, PXTA v1, and PXTE v2 with no older-version fallback; its v3 composite digest commits both canonical bodies through the existing signed Slice field. Runtime execution currently admits only the trusted single-subject one-worker zero-native profile; wider workers and nonzero native pools remain valid desired-state contracts but fail closed until an admitted Runtime owner exists. Incompatible framing, digest, eligibility, or scope changes require new explicit versions and domains."
tests = ["crates/paraegox-runtime-contracts/src/thread_execution.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "crates/paraegox-runtime/src/thread_component_runtime.rs", "tests/contract/test_s5_runtime_thread_execution_request.py", "tests/fixtures/wire/s5_runtime_apply_request_v3.json"]

[[registry.public_apis]]
module = "paraegox_runtime"
symbols = ["run_runtime_host_process", "RuntimeHostProcessError"]
owner = "RuntimeHost process owner"
consumers = ["paraegox-runtime-host"]
compatibility = "This pre-1.0 executable bootstrap surface owns one current-thread reactor and Ctrl-C shutdown only; it deliberately exposes no Tokio type, apply endpoint, Card runner, readiness claim, or durable state."
tests = ["crates/paraegox-runtime/src/runtime_host.rs"]

[cargo]
manifest_path = "Cargo.toml"
lockfile_path = "Cargo.lock"
crate_root = "crates"

[[cargo.rules]]
id = "CARGO-ARCH-001"
source = "paraegox-kernel"
allow_workspace_dependencies = []
allow_external_dependencies = ["sha2"]

[[cargo.rules]]
id = "CARGO-ARCH-002"
source = "paraegox-runtime-contracts"
allow_workspace_dependencies = ["paraegox-kernel"]
allow_external_dependencies = []

[[cargo.rules]]
id = "CARGO-ARCH-003"
source = "paraegox-runtime"
allow_workspace_dependencies = ["paraegox-kernel", "paraegox-runtime-contracts"]
allow_external_dependencies = ["ed25519-dalek", "tokio"]

[[cargo.rules]]
id = "CARGO-ARCH-004"
source = "paraegox-deployment"
allow_workspace_dependencies = ["paraegox-kernel", "paraegox-runtime-contracts"]
allow_external_dependencies = ["ed25519-dalek"]

[[cargo.rules]]
id = "CARGO-ARCH-005"
source = "paraegox-runtime-host"
allow_workspace_dependencies = ["paraegox-runtime"]
allow_external_dependencies = []

[[architecture.rules]]
id = "ARCH-001"
source = "paraegox.kernel"
forbid = [
  "paraegox.decks",
  "paraegox.deployment",
  "paraegox.drivers",
  "paraegox.gateways",
  "paraegox.runtime",
  "paraegox.services",
]
reason = "Kernel mechanisms must not depend on product, deployment, runtime, gateway, driver, or service owners."

[[architecture.rules]]
id = "ARCH-002"
source = "paraegox.runtime"
forbid = ["paraegox.decks", "paraegox.deployment"]
reason = "Runtime consumes runtime-owned apply contracts and must not import deployment or Deck implementation."

[[terminology.rules]]
id = "TERM-001"
identifier = "ModuleSpec"
replacement = "CardDefinition"
reason = "ADR-0002 accepts CardDefinition as the reusable capability contract."

[[terminology.rules]]
id = "TERM-002"
identifier = "ModuleRef"
replacement = "CardDefinitionRef"
reason = "ADR-0002 accepts CardDefinitionRef as the stable reference."

[[terminology.rules]]
id = "TERM-003"
identifier = "ApplicationTopology"
replacement = "DeckTopology"
reason = "DeckTopology is the proposed workload topology term; Application is not a current identity."

[[terminology.rules]]
id = "TERM-004"
identifier = "RemoteDomain"
replacement = "target RuntimeHost placement"
reason = "ExecutionDomain is local to RuntimeHost; remote placement is not a local domain."

[[terminology.rules]]
id = "TERM-005"
identifier = "LocalBus"
replacement = "PortBinding test fixture or Zenoh-backed PortBinding"
reason = "There is one production Fabric and no parallel local production bus."

[[terminology.rules]]
id = "TERM-006"
identifier = "MemoryBus"
replacement = "PortBinding test fixture"
reason = "A test fixture must not become a second public Bus product."

[[terminology.rules]]
id = "TERM-007"
identifier = "MemoryPortBinding"
replacement = "PortBinding test fixture"
reason = "Test implementations do not create a second public live-binding term."

[[terminology.rules]]
id = "TERM-008"
identifier = "ZenohBinding"
replacement = "PortBinding"
reason = "PortBinding is the only public live-binding term."
