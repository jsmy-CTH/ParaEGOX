compatibility = "This experimental Unix-only seam presents one complete non-secret PXDT peer requirement to a repeatable composition-owned resolver: exact peer RuntimeHost, connect endpoint, mTLS profile, trust-domain, local-credential, trust-anchor and expected-peer-identity references plus the contract-owned requirement digest. V1 resolution returns only already validated process-local mTLS file paths and must echo that complete digest; Debug redacts the resolved path value. Runtime rejects digest mismatch and cross-peer credential-file drift before consuming one exact secured-hybrid configuration through the existing single FabricService/session owner. The additive V2 path accepts the same RuntimeFabricCredentialRequirementV1 input but invokes only RuntimeFabricCredentialResolverV2 and never calls or falls back to V1. Each result must echo the exact requirement digest and expected peer identity reference, bind that reference to one bounded canonical lower-case DNS-style CN, and return the common exact resolved file set; Runtime validates the complete canonical PXDT peer set, unique CNs, both echoes, file equality, and the recomputed `paraegox.runtime.distributed-fabric-peer-cn-binding.sha256.experimental.v2` digest over requirement digest, exact expected-peer-identity-ref bytes and exact canonical-CN bytes. Binding digests are retained in canonical PXDT peer order to build the experimental Fabric CN-binding configuration and to validate the later lifecycle-owned live snapshot in that same order; valid result Debug output redacts both CN and paths. V2 changes no PXDT or PXTP wire and grants no V1 fallback. The resolver seam itself neither reads a Secret store nor establishes production certificate identity or authorization. The actual PXAR8 owner accepts one live snapshot only after exact Fabric-generation/control-handle correlation, a typed nonzero Fabric-owned session epoch, and complete peer binding count/order validation. It durably appends and reads back the canonical PXTP/PXEV batch before starting the existing Agent assembly, verifies exactly two installed bindings and their digest, commits signed ActiveReady before handle publication, and uses fresh generations/session/PXTP/Evidence rather than old observations after a crash. Agent shutdown remains ordered before Fabric and fails closed if binding retirement is uncertain. This creates no credential rotation or application retry and is not production SAN/fingerprint proof, a real two-host mTLS system proof, continuous health/reconciliation, a public distributed CLI/TUI composition, or an Evidence service/replication claim. Incompatible requirement fields, resolver trust, credential lifetime, CN canonicalization, binding digest, or authorization semantics require an explicit successor."
tests = ["crates/paraegox-runtime/src/distributed_fabric_runtime.rs", "crates/paraegox-runtime/src/distributed_agent_stack_runtime.rs", "crates/paraegox-runtime/src/managed_fabric_runtime.rs", "crates/paraegox-fabric/src/service.rs"]

[[registry.public_apis]]
module = "paraegox_runtime"
symbols = ["RuntimeAgentProviderResolveError", "RuntimeResolvedAgentProviderV1", "RuntimeAgentProviderResolverV1", "RuntimeModelBackendResolveError", "RuntimeResolvedModelBackendV1", "RuntimeModelBackendResolverV1", "RuntimeDeveloperLocalIdentityRefsV1", "RuntimeDeveloperLocalSigningSeedsV1", "RuntimeDeveloperLocalIdentityV1", "RuntimeDeveloperLocalConfigV1", "RuntimeDeveloperLocalReadyV1", "RuntimeDeveloperLocalLifecycleV1", "RuntimeDeveloperLocalError", "start_runtime_developer_local_v1"]
owner = "Runtime-owned DeveloperLocal lifecycle facade"
consumers = ["paraegox-local"]
compatibility = "This experimental Unix-only facade strictly observes the current executable, derives its build identity, initializes or reopens one owner-private Runtime store, and publishes one authenticated UDS lifecycle. Fresh state serves real PXBR first; only a fully decoded, authenticated and exact-pinned PXFB may durably cut the same listener to the managed Fabric successor, after which the current A2 path uses Runtime-owned PXAR6/PXAR9 and restart recovery; the frozen PXAR7 predecessor remains separately supported. RuntimeDeveloperLocalConfigV1 additively accepts one all-or-nothing typed restricted endpoint input: canonical PXRP, independently resolved profile ref, matching PXCB, one absolute normalized root-CA path, and resolved listener mTLS identity files. Construction immediately uses Fabric's public PXRP-to-listener mapping, rejects profile/carrier or DeveloperLocal target/principal/key-fingerprint drift before thread startup, rejects a second injection instead of replacing generation, and revalidates the same exact carrier against provisioning before opening the listener. A configured listener starts before Ready, returns only the fixed generic rejection while the UDS owner remains legacy, and the same session/receiver reaches the Managed single writer only after authenticated PXFB cutover; managed reopen receives the same complete dependencies and creates no fallback profile or second session. Ready here proves endpoint transport startup, not distributed Agent-stack ActiveReady. The predecessor Agent-provider resolver retains its exact PXAR7 behavior. A2 adds a separate provider-neutral Model-backend resolver: for each committed PXAR9 activation or recovery it receives the exact Model plan, including complete profile/provider/config/optional-Secret selection and adapter ID/version/capability binding, and must return a backend plus the byte-identical plan commitments. Runtime rejects resolution or echo mismatch, retains no provider-specific configuration or credential type, installs ModelService before AgentService, and fences the Model→Agent dependency by generation. The explicit constructor requires both resolvers; legacy constructors install unavailable successors, so no provider-bearing desired state gains a default or fallback. Ready facts expose no raw Fabric, endpoint config, session, route authority, TLS material or provider, and the current A2 opaque Agent handle is issued only for byte-identical committed ActiveReady PXMT; the predecessor claim remains PXST-specific. Drop and shutdown_and_join revoke handles, stop the restricted endpoint, drain and stop Agent→Model→Fabric, remove the UDS and join the owner thread. The profile supports only macOS/Linux on x86_64/aarch64 and is not ProductionReference support."
tests = ["crates/paraegox-runtime/src/runtime_agent_provider.rs", "crates/paraegox-runtime/src/managed_agent_stack_runtime.rs", "crates/paraegox-runtime/src/managed_model_runtime.rs", "crates/paraegox-runtime/src/managed_model_agent_stack_state.rs", "crates/paraegox-runtime/src/managed_model_agent_stack_runtime.rs", "crates/paraegox-runtime/src/runtime_developer_local.rs", "crates/paraegox-runtime/src/runtime_control_endpoint.rs", "crates/paraegox-local/src/composition.rs"]

[[registry.public_apis]]
module = "paraegox_runtime"
symbols = ["RuntimeAgentDeveloperLocalBootstrapV1", "RuntimeAgentDeveloperLocalConversationV1", "RuntimeAgentDeveloperLocalIpcClientV1", "RuntimeAgentDeveloperLocalIpcConfigV1", "RuntimeAgentDeveloperLocalIpcError", "RuntimeAgentDeveloperLocalIpcLifecycleV1", "RuntimeAgentDeveloperLocalIpcLimitsV1", "RuntimeAgentDeveloperLocalIpcPathsV1", "start_runtime_agent_developer_local_ipc_v1"]
owner = "Runtime-owned DeveloperLocal Agent IPC capability owner"
consumers = ["paraegox-sdk Textual console client", "paraegox-tui retained Rust reference", "paraegox-local"]
compatibility = "This Unix-only PXAI/PXAB v1 surface converts one live generation-fenced Runtime Agent handle into a bounded same-user private IPC capability. Runtime creates the socket and mode-0600 bootstrap file, supplies an opaque zeroizing token and exact DeckRun/Session scope, checks peer uid/gid and token before dispatch, rejects forged cross-scope identifiers, bounds concurrent connections/commands/frame sizes/deadlines, and joins endpoint cleanup before Runtime shutdown. The client performs explicit open/submit/get/watch/cancel operations without retry and creates its own request nonce from OS entropy. Before bind, restart recovery rejects a connectable active owner and removes only a connection-refused mode-0600 socket with the exact expected uid/gid and stable device/inode/mode identity, either as socket-only residue or paired with a canonical mode-0600, single-link PXAB whose socket path and server uid/gid match. Bootstrap-only residue, symlink, ownership/type/permission/link-count drift, non-canonical bootstrap bytes or named-identity drift fail closed; removal rechecks each exact named identity and syncs the parent directory. Bootstrap bytes, token and endpoint are DeveloperLocal private capability material, not a public remote protocol, Fabric descriptor, Secret store, desired-state path, lifecycle right, production endpoint or distributed-readiness proof."
tests = ["crates/paraegox-runtime/src/runtime_agent_developer_local_ipc.rs", "crates/paraegox-tui/src/runtime_developer_local_ipc.rs", "crates/paraegox-local/src/composition.rs", "tests/console/test_console_client.py"]

[[registry.public_apis]]
module = "paraegox-runtime-host CLI"
symbols = ["release-descriptor-v1", "install-v1", "serve-bootstrap-v1", "migrate-journal-v3-to-v4-v1", "migrate-journal-v4-to-v5-v1"]
owner = "Final RuntimeHost release/install/control/migration command owner"
consumers = ["Runtime release pipeline", "system installer/operator", "DeploymentController"]
compatibility = "The five versioned commands use exact positional lower-hex and absolute-path grammars with no optional or additional arguments. No arguments continues to start the existing RuntimeHost process; unknown or malformed commands fail before mutation. `release-descriptor-v1` publishes the descriptor for the exact final executable; `install-v1` independently observes that executable, verifies the supplied descriptor digest, creates the singleton manifest, and initializes sequence one; `serve-bootstrap-v1` reopens the exact store and provisioning pins, completes bounded fixed-profile Loop/Empty restart reassembly before listener publication, and then serves the authenticated local PXBR/PXQR/PXAR endpoint. The frozen `migrate-journal-v3-to-v4-v1` and new `migrate-journal-v4-to-v5-v1` each take an explicit stopped store, separate evidence directory, expected store/target identities, and migration ID, then emit a canonical PXMR receipt only after their exact same-lock offline migration; the latter accepts only states with no prepared or recovery action. The ProductionReference profile requires Linux GNU ext4 state plus a root:root mode-0555 executable and distinct non-root Runtime, Controller, and Authority identity evidence; unsupported platforms fail closed. Query does not imply Controller reconciliation, fixed-profile reassembly does not imply general Thread/Process recovery, and migration is neither rollback nor recovery. Incompatible grammar or authority changes require a new command version."
tests = ["crates/paraegox-runtime-host/src/main.rs", "crates/paraegox-runtime/src/runtime_host_entrypoint.rs", "crates/paraegox-runtime/src/runtime_control_endpoint.rs", "tests/system/test_s7_runtime_install_process.py"]

[[registry.public_apis]]
module = "paraegox_runtime_host::service_manager"
symbols = ["HostWatchdogTiming", "HostTerminationTiming", "HostRestartPolicy", "RuntimeHostServiceManagerPolicy", "RuntimeHostLaunch", "ServiceManagerFailure", "ServiceManagerEvidenceKind", "ServiceManagerEvidence", "RuntimeHostServiceManagerState", "RuntimeHostServiceManagerSnapshot", "RuntimeHostServiceManager", "ServiceManagerError"]
owner = "External RuntimeHost lifecycle owner"
consumers = ["POSIX OS service-manager profiles", "external RuntimeHost system harness"]
compatibility = "This internal P2d reference adapter owns one exact RuntimeHost process group and the only restart-window/backoff/quarantine mutation ledger. The restart window counts actual replacement spawn attempts rather than pending schedules. Reaped/restart requires both direct-child reap and exact PGID absence, including TERM-ignoring same-group descendants; every OS-created child consumes a unique generation, and post-spawn setup cleanup failure retains the sole process owner and quarantines without replacement. The reference executable keeps that quarantine in a signal-responsive owner loop, with synchronous Drop retained only as the final fail-safe. Its fixed-capacity evidence records external observations and process actions, never Runtime/ProcessDomain receipts. The proof does not cover ProcessDomain workers deliberately launched into distinct process groups if RuntimeHost is uncatchably killed; production orphan cleanup needs a shared cgroup/job object or durable external ownership journal. It intentionally exposes no NodeDaemon/Node facts, Deployment input, arbitrary shell/environment launch, or second recovery-action owner; wider platform service-manager integration may replace this POSIX reference behind equivalent contract evidence."
tests = ["crates/paraegox-runtime-host/src/service_manager.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]

