tests = ["crates/paraegox-runtime-contracts/src/assignment.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s3_runtime_apply_request.py"]

