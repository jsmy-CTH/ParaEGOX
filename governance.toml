tests = ["crates/paraegox-runtime-contracts/src/execution.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-runtime/src/admission.rs", "tests/contract/test_s4_runtime_execution_request.py", "tests/fixtures/wire/s4_runtime_apply_request_v2.json"]

