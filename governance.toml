schema_version = 1

[repository]
source_root = "src/paraegox"
term_scan_roots = ["src", "crates", "configs"]
exception_scan_roots = ["src", "crates", "tests", "scripts", ".github"]
documentation_roots = ["README.md", "README_zh.md"]
untracked_only_roots = ["docs"]
allowed_top_level_directories = [".github", "configs", "crates", "docs", "scripts", "src", "tests"]
ignored_top_level_directories = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "__pycache__", "build", "dist", "target"]

[registry]
# Do not add placeholders. Add rows only in the same change that creates the real surface.
deprecations = []
feature_flags = []

[[registry.waivers]]
id = "GOV-WAIVER-0001"
rule_id = "rust:expect"
scope = "crates/paraegox-runtime/src/lib.rs"
owner = "Runtime apply admission and state owner"
reason = "Keep the admitted B2/P2a state mechanisms, S4/P2b Loop composition, S5/P2c ThreadDomain/ExecutorBudget composition, the S6/P2d local POSIX ProcessDomain baseline, and fixed two-CoreService lifecycle evidence private until the P2e Runtime apply endpoint and assembly owner become their executable consumer. The binary consumes only the reactor/task/clock bootstrap, while these component mechanisms remain L2/P2d evidence; remove or narrow this expectation in P2e."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0002"
rule_id = "rust:expect"
scope = "crates/paraegox-deployment/src/lib.rs"
owner = "Deployment pure-compile, projection, and apply-envelope owner"
reason = "Keep the tested S7-C DeckCompiler/Planner enabler and canonical request producer private until the P2e operator ingress and DeploymentController become their admitted executable consumers. The opaque manifest seam has no production constructor and does not prove installer provenance; remove or narrow this expectation when S7-E connects the unique installer artifact and executable control-plane path."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0003"
rule_id = "pytest:skip"
scope = "tests/system/test_s6_python_reference_worker.py"
owner = "ProcessDomain reference worker and system evidence owner"
reason = "The S6 reference-worker system harness deliberately exercises POSIX process groups, Unix signals, and descriptor semantics. Keep the explicit non-POSIX skip until a separately admitted platform backend and equivalent cleanup harness exist; this waiver does not skip any supported POSIX profile."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0004"
rule_id = "rust:ignore"
scope = "crates/paraegox-runtime/src/process_domain.rs"
owner = "Runtime ProcessDomain cross-language evidence owner"
reason = "Only the exact python_reference_worker_round_trips_through_rust_process_domain test is ignored by the Rust-only job because it requires the uv-managed interpreter; the uv CI job executes it explicitly. Remove this split-run exception when the P2e production Artifact runner or an independent cross-language suite becomes the sole owner of equivalent Rust-host/Python-worker evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0005"
rule_id = "rust:ignore"
scope = "crates/paraegox-runtime/src/process_domain.rs"
owner = "Runtime ProcessDomain native-worker system evidence owner"
reason = "Only the exact rust_reference_worker_faults_preserve_uncertain_ownership_and_cleanup test is ignored by the default library test because it consumes the separately built reference-worker executable by absolute path. CI builds that executable and runs this test explicitly; remove the split-run exception when P2e provides the production Artifact runner and equivalent end-to-end evidence."
expires_at = "2026-09-30"

[[registry.packages]]
path = "crates/paraegox-kernel"
cargo_package = "paraegox-kernel"
owner = "Kernel mechanisms"
responsibility = "Canonical digest framing, identity values, and owner-local monotonic time values shared by admitted mechanism owners."
status = "public"
public_entrypoints = ["paraegox_kernel::digest", "paraegox_kernel::identity", "paraegox_kernel::time"]
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
first_tests = ["crates/paraegox-kernel/src/digest.rs", "crates/paraegox-kernel/src/identity.rs", "crates/paraegox-kernel/src/time.rs"]
removal_condition = "Removal requires migrating every registered mechanism consumer and its canonical digest, identity, or time evidence."

[[registry.packages]]
path = "crates/paraegox-runtime-contracts"
cargo_package = "paraegox-runtime-contracts"
owner = "Runtime contract owner"
responsibility = "Source-plan provenance, canonical PXTA binding assignments, canonical PXTE v1 Loop, additive PXTE v2 Loop+Thread, and additive PXTE v3 Loop+Thread+Process inbound-Mailbox assignments, v2/v3/v4 composite target digests, complete PXAR v1/v2/v3/v4 Runtime apply requests, strict PXWP v1 worker-session framing, B1 apply-control commitments, writer-tenure signing and fingerprints, temporal constraints, and the canonical B2 signed apply-envelope wire contract; desired Process profile references do not themselves enforce a sandbox or launch an OS process, and this package does not model a general execution plan or source-only Cards with no input Mailbox."
status = "public"
public_entrypoints = ["paraegox_runtime_contracts::assignment", "paraegox_runtime_contracts::execution", "paraegox_runtime_contracts::thread_execution", "paraegox_runtime_contracts::process_execution", "paraegox_runtime_contracts::process_protocol", "paraegox_runtime_contracts::provenance", "paraegox_runtime_contracts::apply", "paraegox_runtime_contracts::temporal", "paraegox_runtime_contracts::wire"]
consumers = ["paraegox-deployment", "paraegox-runtime"]
first_tests = ["crates/paraegox-runtime-contracts/src/assignment.rs", "crates/paraegox-runtime-contracts/src/execution.rs", "crates/paraegox-runtime-contracts/src/thread_execution.rs", "crates/paraegox-runtime-contracts/src/process_execution.rs", "crates/paraegox-runtime-contracts/src/process_protocol.rs", "crates/paraegox-runtime-contracts/src/provenance.rs", "crates/paraegox-runtime-contracts/src/apply.rs", "crates/paraegox-runtime-contracts/src/temporal.rs", "crates/paraegox-runtime-contracts/src/wire.rs", "tests/contract/test_s5_runtime_thread_execution_request.py", "tests/contract/test_s6_runtime_process_execution_request.py", "tests/contract/test_s6_process_worker_protocol.py"]
removal_condition = "Removal requires replacing both the independent Deployment producer and Runtime consumer in one accepted contract migration."

[[registry.packages]]
path = "crates/paraegox-runtime"
cargo_package = "paraegox-runtime"
owner = "Runtime apply admission and state owner"
responsibility = "Signed-request admission and apply-control transitions through strict PXAR v4 decoding, bounded Mailbox and PortBinding, the current-thread RuntimeHost reactor and structured task owner, the strict PXHW v1 inherited-stream watchdog contract and explicitly enabled same-reactor heartbeat/control endpoint, S4 LoopDomain dispatch, S5 RuntimeHost-owned ExecutorBudget/ThreadDomain with fixed workers, and a private S6 local POSIX ProcessDomain baseline with strict PXWP session transport, single-invocation credit ownership, liveness/recovery facts, bounded process-group termination, and identity-guarded ephemeral workspace cleanup; it also contains an internal Rust PXWP reference-worker fixture that validates its dialogue with the canonical protocol session and owns no Runtime or recovery authority, plus private single-subject trusted synchronous Card and fixed provider-consumer two-CoreService lifecycle evidence. PXHW frames prove only external observation of exact-generation reactor progress and are not readiness or Runtime/ProcessDomain receipts. These L2/P2d paths are not yet consumed by a public apply endpoint. Process launch resolution remains a trusted caller seam. The unexpected ProcessDomain destructor can preserve a still-live process plus workspace in one best-effort reaper, but that reaper is not registered or joined and cannot contribute cleanup proof; production assembly must replace it with a bounded RuntimeHost-owned reaper registry. Signed sandbox/resource policies, hostile descendants that escape their owned process group, and independently grouped ProcessDomain workers after an uncatchable RuntimeHost SIGKILL are not externally contained; a common cgroup/job object or durable external ownership journal is required before claiming production orphan cleanup. Durable RuntimeHost journal, Fabric, Controller, and a full RuntimeAssemblyEngine are also not implemented."
status = "experimental"
public_entrypoints = ["paraegox_runtime::host_watchdog", "paraegox_runtime::run_runtime_host_process"]
consumers = ["paraegox-runtime-host"]
first_tests = ["crates/paraegox-runtime/src/admission.rs", "crates/paraegox-runtime/src/apply_state.rs", "crates/paraegox-runtime/src/request.rs", "crates/paraegox-runtime/src/mailbox.rs", "crates/paraegox-runtime/src/port_binding.rs", "crates/paraegox-runtime/src/runtime_clock.rs", "crates/paraegox-runtime/src/task_registry.rs", "crates/paraegox-runtime/src/dispatcher.rs", "crates/paraegox-runtime/src/loop_domain.rs", "crates/paraegox-runtime/src/card_instance.rs", "crates/paraegox-runtime/src/card_executor.rs", "crates/paraegox-runtime/src/component_runtime.rs", "crates/paraegox-runtime/src/thread_component_runtime.rs", "crates/paraegox-runtime/src/executor_budget.rs", "crates/paraegox-runtime/src/thread_domain.rs", "crates/paraegox-runtime/src/thread_registry.rs", "crates/paraegox-runtime/src/process_domain.rs", "crates/paraegox-runtime/src/process_platform.rs", "crates/paraegox-runtime/src/process_transport.rs", "crates/paraegox-runtime/src/process_workspace.rs", "crates/paraegox-runtime/src/liveness.rs", "crates/paraegox-runtime/src/recovery.rs", "crates/paraegox-runtime/src/runtime_ownership.rs", "crates/paraegox-runtime/src/bin/paraegox-rust-reference-worker.rs", "crates/paraegox-runtime/tests/rust_reference_worker.rs", "crates/paraegox-runtime/src/core_service.rs", "crates/paraegox-runtime/src/host_watchdog.rs", "crates/paraegox-runtime/src/runtime_host.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]
removal_condition = "Removal requires replacing the executable consumer and every proven canonical-request-to-bounded-Domain ownership path without adding a second desired-state, task, thread, process, recovery, or payload-queue owner."

[[registry.packages]]
path = "crates/paraegox-runtime-host"
cargo_package = "paraegox-runtime-host"
owner = "RuntimeHost process and external service-manager adapter owner"
responsibility = "Minimal executable composition root for the single RuntimeHost reactor plus a separate POSIX reference OS service-manager adapter. The adapter runs in a different process fault domain, exclusively owns the exact RuntimeHost child/process group, bounded PXHW observation evidence, restart-window/backoff ledger charged at each actual replacement spawn attempt, TERM/KILL/reap actions, and quarantine mutation; it records Reaped and permits restart only after the direct child is reaped and that exact process group is observed absent. A post-spawn setup failure permanently consumes the spawned child generation and records its cleanup; if cleanup cannot be proven, the adapter retains the Child/PG owner in quarantine, forbids replacement, and remains synchronously owned across unexpected manager Drop. The reference executable keeps quarantined ownership in an explicit signal-responsive control loop instead of treating unbounded Drop as its normal quarantine path. This proof covers same-group descendants only. A ProcessDomain worker deliberately placed in its own process group is not enumerable from the inherited PXHW channel after RuntimeHost SIGKILL, so this adapter cannot claim its cleanup without a common cgroup/job object or durable external ownership journal. It does not create a P5 NodeDaemon, Node facts, Deployment authority, Runtime/ProcessDomain receipt, or second restart loop. The RuntimeHost process remains idle apart from its explicitly enabled watchdog endpoint and owns no Deployment planning, apply input, Card configuration, Fabric, or persistence."
status = "internal"
public_entrypoints = ["paraegox_runtime_host::service_manager"]
consumers = []
first_tests = ["crates/paraegox-runtime/src/host_watchdog.rs", "crates/paraegox-runtime/src/runtime_host.rs", "crates/paraegox-runtime-host/src/service_manager.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs"]
removal_condition = "Remove only when another admitted OS-managed executable becomes the sole RuntimeHost reactor composition root."

[[registry.packages]]
path = "crates/paraegox-deployment"
cargo_package = "paraegox-deployment"
owner = "Deployment pure-compile, projection, and apply-envelope owner"
responsibility = "Pure projection from committed deployment identities and canonical target assignments plus Loop/Thread/Process execution plans into complete Runtime slices and signature-independent PXAR v1/v2/v3/v4 apply-request drafts, together with the internal S7-C deterministic DeckSpec-to-DeckLock compiler, typed Deck and ServiceDependency validation, reference-profile Planner candidate, stable allocation delta, and opaque manifest-projection selection seam. The S7-C seam does not parse, generate, or prove installer provenance for the crate-private S7-B manifest; that unique artifact connection remains gated on the S7-E producer/consumer vertical. Signing keys, clocks, process construction, persistence, network access, and I/O remain caller-owned."
status = "enabler"
public_entrypoints = []
consumers = []
first_tests = ["crates/paraegox-deployment/src/deck.rs", "crates/paraegox-deployment/src/planner.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "tests/governance/test_s7_pure_compile_boundary.py"]
removal_condition = "Remove or restructure this enabler if the P2e DeploymentController cannot reuse the P2a-proven canonical projection/request path and S7-C pure compile path without a parallel producer; remove the opaque S7-C manifest seam when S7-E connects the one runtime-contract-owned strict manifest artifact."

[[registry.public_apis]]
module = "paraegox_kernel::digest"
symbols = ["Digest32", "DigestBuildError", "Digest32Builder"]
owner = "Kernel mechanisms"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "The SHA-256-v1 framing and golden bytes are stable; semantic domains remain contract-owned and versioned."
tests = ["crates/paraegox-kernel/src/digest.rs"]

[[registry.public_apis]]
module = "paraegox_kernel::identity"
symbols = ["RuntimeHostId", "PrincipalRef"]
owner = "Kernel identity values"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "Types stay opaque and non-interchangeable; their 16-byte values are stable in explicitly registered B2 envelope fields without defining a global serializer beyond those fields."
tests = ["crates/paraegox-kernel/src/identity.rs"]

[[registry.public_apis]]
module = "paraegox_kernel::time"
symbols = ["ClockDomainRef", "ClockGeneration", "BoundedDuration", "MonotonicInstant", "ClockReading", "MonotonicDeadline", "TimeError"]
owner = "Kernel time values"
consumers = ["paraegox-runtime-contracts", "paraegox-runtime", "paraegox-deployment"]
compatibility = "ClockDomainRef's 16-byte value, nonzero ClockGeneration, and nanosecond BoundedDuration are stable where embedded by B2 wire v1; MonotonicInstant, ClockReading, and MonotonicDeadline remain owner-local and are not serialized as protocol time."
tests = ["crates/paraegox-kernel/src/time.rs"]

