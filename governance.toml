module = "paraegox_runtime_contracts::execution"
symbols = ["TARGET_EXECUTION_PLAN_VERSION", "RUNTIME_APPLY_REQUEST_V2_VERSION", "MAX_LOOP_DOMAINS", "MAX_MAILBOX_EXECUTIONS", "MAX_DOMAIN_OUTSTANDING", "MAX_SERVICE_COST_TOKENS", "MAX_MINIMUM_SERVICE_WEIGHT", "MAX_ARRIVALS_PER_WINDOW", "MAX_EXECUTION_DURATION_NANOS", "MAX_TARGET_EXECUTION_PLAN_BYTES", "MAX_RUNTIME_APPLY_REQUEST_V2_BYTES", "DomainRef", "CardDefinitionRef", "CardImplementationRef", "TargetExecutionDigest", "CallModel", "WorkloadKind", "BlockingRisk", "RunBoundProvenance", "DispatchClass", "OverrunAction", "LoopDomainCapacity", "LoopLifecycleBudgets", "LoopDomainSpec", "CardSubjectSpec", "LoopExecutionRequirements", "CallbackBudgets", "MailboxDispatchPolicy", "MailboxExecutionSpec", "TargetExecutionPlan", "TargetPlanAssignments", "RuntimePlanSliceV2", "RuntimeApplyRequestV2", "ExecutionContractError", "TargetPlanContractError", "ExecutionRecordSection", "ExecutionWireErrorCode", "ExecutionWireError", "TargetPlanWireErrorCode", "RequestV2WireErrorCode", "RequestV2WireError"]
