[[registry.packages]]
path = "crates/paraegox-runtime"
cargo_package = "paraegox-runtime"
owner = "Runtime apply, installation, and state owner"
responsibility = "Signed-request admission and apply-control transitions through strict canonical apply-request decoding, bounded Mailbox and PortBinding, the current-thread RuntimeHost reactor and structured task owner, the strict PXHW v1 inherited-stream watchdog endpoint, S4 LoopDomain dispatch, S5 RuntimeHost-owned ExecutorBudget/ThreadDomain, and the private S6 local POSIX ProcessDomain baseline remain implemented at their previously admitted evidence levels. S7-D/W1 provides the crate-private bounded Runtime journal/state machine and owner-private Unix journal store with strict path/identity validation, one-writer locking, bounded canonical reads, atomic file/directory-sync publication, restart precedence, and fail-closed uncertainty; ProductionReference remains exact Linux GNU ext4 while macOS APFS fails closed pending PC1 evidence. S7-E adds the one-shot initializer, compiled-actual verification, pinned final-executable observation, durable installation, and exact `release-descriptor-v1` and `install-v1` commands. S7-F payload v5 persists complete contract-owned Slice provenance across prepared, active, retiring, recovery, and terminal lineages, the exact prepared request-time response channel, and a distinct reserved-at-crash exact-zero resource shape that never fabricates ownership identities. Normal startup accepts only v5. The frozen `migrate-journal-v3-to-v4-v1` still targets exact payload v4, while `migrate-journal-v4-to-v5-v1` accepts only lossless states with no prepared or recovery action; both run stopped under the same lock with separately durable read-only source evidence and canonical PXMR receipts. The exact `serve-bootstrap-v1` mode runs one authenticated owner-private Unix control endpoint: the same bounded four-byte-framed channel strictly handles canonical PXBR bootstrap, PXQR query and PXAR v5 apply requests, then the explicit PXFB/PXAR6/PXAR7/PXAR8/PXAR9 successors only under their admitted cutover/profile rules. Before a listener capability exists, fixed-profile startup validates every durable Slice, terminal Receipt, lineage, and historical channel, invalidates the old generation, converges interrupted normal/takeover resources to exact-zero or operational quarantine, and performs at most one bounded fresh recovery action; a durable post-intent restart never replays the callback. Query is a read-only projection of durable plus live owner state, returns a Runtime-signed and request-correlated PXQS, and never performs recovery or mutates authority. Apply revalidates socket identity and peer credentials, authenticates Controller and Authority signatures plus manifest/policy/channel/store/clock/CAS pins, drives the fixed reference Loop or exact-zero Empty native owner, and returns a canonical Runtime-signed PXRT terminal Receipt. Historical terminal replay is byte-identical and authenticated against the original request-time channel; fresh apply uses a sealed one-use post-tenure token and repeated owner-clock fences. Installed-production observation requires a root:root mode-0555 final executable; non-Linux artifact observation and non-ext4 production state fail closed. The deploymentd facade now consumes PXQR/PXQS through an exact one-shot reconciliation command, but a continuous Controller reconciler, wider plan profiles, and a complete general RuntimeAssemblyEngine remain unimplemented. The additive Unix DeveloperLocal lifecycle observes and hashes its actual executable, strictly initializes or reopens one owner-private Runtime store, serves authenticated PXBR before an authenticated PXFB performs the one-way managed cutover on the same UDS identity, recovers the Runtime-owned Fabric, Model, and Agent generations, privately owns the sole two-lane PXAP-over-Fabric transport and descriptor implementation, issues only an opaque conversation handle after exact PXMT ActiveReady correlation, and joins Agent, Model, Fabric, UDS and owner-thread shutdown. This DeveloperLocal path is an explicit non-production consumer and does not weaken ProductionReference filesystem or service-account policy. The additive managed Model+Agent owner now durably executes PXAR v9 on the same authenticated endpoint, resolves and verifies the exact Model plan and adapter binding, starts Model before Agent, exposes only a Ready generation-fenced Agent dependency, signs PXMT, and drains/stops Agent then Model before Fabric; it remains a fixed profile rather than a general assembly graph. Restart reassembly covers only the compiled-in in-process reference Loop/Empty and fixed Fabric-to-Agent and Fabric/Model-to-Agent profiles; it does not add general readiness, recover Thread/Process assembly, or solve the existing independently grouped ProcessDomain orphan/containment limitation. PXHW still proves only reactor progress and Process launch resolution remains a trusted caller seam."
status = "experimental"
public_entrypoints = ["paraegox_runtime::host_watchdog", "paraegox_runtime::RuntimeAgentConversationHandle", "paraegox_runtime::RuntimeAgentConversationError", "paraegox_runtime::run_runtime_host_process", "paraegox_runtime::run_runtime_host_entrypoint", "paraegox_runtime::{RuntimeFabricCredentialRequirementV1, RuntimeFabricCredentialResolveError, RuntimeFabricCredentialResolveErrorV2, RuntimeFabricCredentialResolverV1, RuntimeFabricCredentialResolverV2, RuntimeResolvedFabricCredentialFilesV1, RuntimeResolvedFabricPeerCredentialV2}", "paraegox_runtime::{RuntimeModelBackendResolveError, RuntimeResolvedModelBackendV1, RuntimeModelBackendResolverV1}", "paraegox_runtime::{RuntimeAgentProviderResolveError, RuntimeResolvedAgentProviderV1, RuntimeAgentProviderResolverV1, RuntimeDeveloperLocalIdentityRefsV1, RuntimeDeveloperLocalSigningSeedsV1, RuntimeDeveloperLocalIdentityV1, RuntimeDeveloperLocalConfigV1, RuntimeDeveloperLocalReadyV1, RuntimeDeveloperLocalLifecycleV1, RuntimeDeveloperLocalError, start_runtime_developer_local_v1}", "paraegox_runtime::{RuntimeAgentDeveloperLocalBootstrapV1, RuntimeAgentDeveloperLocalConversationV1, RuntimeAgentDeveloperLocalIpcClientV1, RuntimeAgentDeveloperLocalIpcConfigV1, RuntimeAgentDeveloperLocalIpcError, RuntimeAgentDeveloperLocalIpcLifecycleV1, RuntimeAgentDeveloperLocalIpcLimitsV1, RuntimeAgentDeveloperLocalIpcPathsV1, start_runtime_agent_developer_local_ipc_v1}"]
current_capability_limit = "The additive experimental PXAR8 path invokes RuntimeFabricCredentialResolverV2 only, with no V1 fallback, and starts one lifecycle-owned Fabric generation. It accepts a live-link snapshot only when the control handle and Runtime-held generation match, the Fabric owner supplies a typed nonzero session epoch, and every peer binding digest and owner-issued sequence matches the complete configured peer count and canonical order. PXDA v2 binds one exact local Evidence store epoch/owner, persists a bounded EvidenceCommitIntent containing one canonical PXTP RuntimeFact per peer, appends each record to LocalEvidenceStoreV1, and verifies its typed commit receipt plus exact readback. Only after that verified commit may Runtime start the existing ManagedAgentAssembly on the same generation-fenced Fabric control, require an initial zero binding census, verify the two installed request/event descriptor digests, the contract-owned binding-set digest and physical census two, then atomically clear the handoff while retaining the Evidence owner head and durably persist signed ActiveReady before publishing an opaque Agent handle. A broker-publication failure is reported as CommittedHandleUnavailable and can be retried from authenticated terminal replay; loss of the durable/lifecycle owner remains the distinct CommittedOwnerRestartRequired outcome. Restart never uses an old PXTP batch as authority to recreate Agent effects: phase-11/Committed and prior ActiveReady recovery advance Fabric and Agent generations through a fresh RecoveryIntent, require a new Fabric session and commit a new PXTP/PXEV batch while preserving historical terminal bytes. Shutdown revokes the handle and retires Agent plus both bindings before Fabric; uncertain Agent cleanup retains Fabric authority and fails closed into quarantine/restart recovery. Remote focused evidence validates the host-local path from an already validated snapshot through durable Evidence, real local bindings, ActiveReady, broker claim, labelled Echo conversation and Agent-first cleanup. That boundary does not validate remote link observation, restricted cutover, a credentialed real model, production SAN/fingerprint identity, a real two-host mTLS system, partition/reconnect behavior, continuous reconciliation/link health, a public distributed CLI/TUI composition, or an Evidence service/replication plane."
