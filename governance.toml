[[registry.packages]]
path = "crates/paraegox-runtime"
cargo_package = "paraegox-runtime"
owner = "Runtime apply, installation, and state owner"
responsibility = "Signed-request admission and apply-control transitions through strict canonical apply-request decoding, bounded Mailbox and PortBinding, the current-thread RuntimeHost reactor and structured task owner, the strict PXHW v1 inherited-stream watchdog endpoint, S4 LoopDomain dispatch, S5 RuntimeHost-owned ExecutorBudget/ThreadDomain, and the private S6 local POSIX ProcessDomain baseline remain implemented at their previously admitted evidence levels. S7-D/W1 provides the crate-private bounded Runtime journal/state machine and owner-private Unix journal store with strict path/identity validation, one-writer locking, bounded canonical reads, atomic file/directory-sync publication, restart precedence, and fail-closed uncertainty; ProductionReference remains exact Linux ext4 while macOS APFS fails closed pending PC1 evidence. S7-E adds a real one-shot Runtime initializer, independent compiled-actual verification, pinned Linux `/proc/self/exe` observation and SHA-256, final-executable build metadata intake, bounded symlink-free descriptor/install-artifact files with no-overwrite byte-identical crash retry, and a public RuntimeHost entrypoint whose exact `release-descriptor-v1` and `install-v1` modes generate the canonical descriptor, generate the singleton manifest, and durably publish sequence one. Its exact `serve-bootstrap-v1` mode now runs one authenticated owner-private Unix control endpoint: the same four-byte-framed channel strictly handles canonical PXBR bootstrap and PXAR v5 apply requests, revalidates socket identity and peer credentials, authenticates Controller and Authority signatures plus manifest/policy/channel/store/clock/CAS pins, drives the fixed reference Loop or exact-zero Empty native owner, and returns only a canonical Runtime-signed PXRT terminal Receipt. Historical terminal replay is byte-identical and authenticated against the original request-time channel; fresh apply uses a sealed one-use post-tenure token and repeated owner-clock fences. Installed-production observation requires a root:root mode-0555 final executable; non-Linux artifact observation and non-ext4 production state fail closed. Runtime query, production restart reassembly/recovery, Fabric, wider plan profiles, and a complete general RuntimeAssemblyEngine remain unimplemented; a fresh owner without its durable-action memory token fails closed rather than claiming recovery. PXHW still proves only reactor progress, Process launch resolution remains a trusted caller seam, and the existing ProcessDomain orphan/containment limitations remain unchanged."
status = "experimental"
public_entrypoints = ["paraegox_runtime::host_watchdog", "paraegox_runtime::run_runtime_host_process", "paraegox_runtime::run_runtime_host_entrypoint"]
consumers = ["paraegox-runtime-host"]
first_tests = ["crates/paraegox-runtime/src/admission.rs", "crates/paraegox-runtime/src/apply_state.rs", "crates/paraegox-runtime/src/request.rs", "crates/paraegox-runtime/src/mailbox.rs", "crates/paraegox-runtime/src/port_binding.rs", "crates/paraegox-runtime/src/runtime_clock.rs", "crates/paraegox-runtime/src/task_registry.rs", "crates/paraegox-runtime/src/dispatcher.rs", "crates/paraegox-runtime/src/loop_domain.rs", "crates/paraegox-runtime/src/card_instance.rs", "crates/paraegox-runtime/src/card_executor.rs", "crates/paraegox-runtime/src/component_runtime.rs", "crates/paraegox-runtime/src/thread_component_runtime.rs", "crates/paraegox-runtime/src/executor_budget.rs", "crates/paraegox-runtime/src/thread_domain.rs", "crates/paraegox-runtime/src/thread_registry.rs", "crates/paraegox-runtime/src/process_domain.rs", "crates/paraegox-runtime/src/process_platform.rs", "crates/paraegox-runtime/src/process_transport.rs", "crates/paraegox-runtime/src/process_workspace.rs", "crates/paraegox-runtime/src/liveness.rs", "crates/paraegox-runtime/src/recovery.rs", "crates/paraegox-runtime/src/runtime_ownership.rs", "crates/paraegox-runtime/src/runtime_journal.rs", "crates/paraegox-runtime/src/runtime_store.rs", "crates/paraegox-runtime/src/runtime_control_state.rs", "crates/paraegox-runtime/src/runtime_reference_apply.rs", "crates/paraegox-runtime/src/runtime_reference_owner.rs", "crates/paraegox-runtime/src/runtime_control_endpoint.rs", "crates/paraegox-runtime/src/runtime_provisioning.rs", "crates/paraegox-runtime/src/runtime_initializer.rs", "crates/paraegox-runtime/src/runtime_artifact.rs", "crates/paraegox-runtime/src/runtime_build_metadata.rs", "crates/paraegox-runtime/src/runtime_install_files.rs", "crates/paraegox-runtime/src/runtime_host_entrypoint.rs", "crates/paraegox-runtime/src/bin/paraegox-rust-reference-worker.rs", "crates/paraegox-runtime/tests/rust_reference_worker.rs", "crates/paraegox-runtime/src/core_service.rs", "crates/paraegox-runtime/src/host_watchdog.rs", "crates/paraegox-runtime/src/runtime_host.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs", "tests/system/test_s7_runtime_install_process.py"]
