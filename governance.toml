[[registry.packages]]
path = "crates/paraegox-deployment"
cargo_package = "paraegox-deployment"
owner = "Deployment planning, one-shot Controller, and reference tenure-authority process owner"
responsibility = "Pure projection from committed deployment identities and canonical target assignments plus Loop/Thread/Process execution plans into complete Runtime apply-request drafts; the deterministic DeckSpec-to-DeckLock compiler, typed Deck validation, reference-profile Planner, stable allocation delta, and manifest-bound projection; and the POSIX DeploymentTenureAuthority single-writer process. The Authority process validates the exact Controller signature/allowlist and local peer credential, durably commits an Ed25519 WriterTenureProof before returning it, and replays exact operations without resetting state. S7-E now has a real one-shot DeploymentController facade and `paraegox-deploymentd` binary with six exact versioned commands. `initialize-reference-v1` consumes the installer manifest exactly once and pins it with the Controller request-auth identity. `commit-reference-loop-v1` reopens only that journal-pinned manifest, runs DeckCompiler and Planner, previews both transitions, and durably commits the reference Loop plan. `acquire-tenure-v1` is the real Controller client for the authenticated local Authority IPC; it persists exact Prepared/Uncertain/Committed transactions, pins the Authority domain, replays only the globally latest matching writer proof, and fails closed when another writer fences it. `bootstrap-runtime-v1` authenticates the local Runtime bootstrap exchange and durably pins the exact Runtime store, manifest, channel policy, request-time response signer, clock, and host epoch. `apply-reference-v1` lazily creates and commits the exact signed PXAR before one direct Runtime send, persists only a strictly correlated Runtime-signed PXRT, returns byte-identical terminal replay without resending, and never promotes NotSent or Uncertain transport outcomes to success. `commit-reference-empty-v1` admits only revision-one Loop state with an exact direct OneSourceLoopActive PXRT, archives that terminal rollout, tombstones the stable allocation, and commits the revision-two Empty plan for the same apply path. Tenure, terminal apply, and committed Empty-plan replays return byte-identical transaction-bound receipts without a second Authority/Runtime send or Controller-journal mutation. Loop-plan replay is byte-identical only while its receipt-bearing snapshot has not been superseded; a later bootstrap successor changes that physical snapshot, and a bootstrap refresh may legitimately pin a newer Runtime epoch. Changed identities, authority/channel policy, operation inputs, CAS state, or superseded tenure fail closed. Authority and Controller ProductionReference stores accept exact Linux ext4; macOS APFS remains fail closed pending PC1 ACL and crash-durability evidence. The two public Rust facades expose only opaque errors. This narrow Loop-to-Empty executable path exists in the current worktree but has not yet been verified by an Ubuntu CI run. Deploymentd remains one-shot rather than a daemon or reconciler; Runtime query, Controller reconciliation, production restart reassembly/recovery, general workload admission, and wider deployment profiles remain absent. Exact durable terminal replay across a Runtime restart does not constitute general live-state reassembly or recovery."
status = "experimental"
public_entrypoints = ["paraegox_deployment::run_tenure_authority_process", "paraegox_deployment::run_deploymentd_process", "paraegox-deploymentd initialize-reference-v1/commit-reference-loop-v1/commit-reference-empty-v1/acquire-tenure-v1/bootstrap-runtime-v1/apply-reference-v1 CLI"]
consumers = ["paraegox-tenure-authority", "paraegox-deploymentd"]
first_tests = ["crates/paraegox-deployment/src/deck.rs", "crates/paraegox-deployment/src/planner.rs", "crates/paraegox-deployment/src/projection.rs", "crates/paraegox-deployment/src/envelope.rs", "crates/paraegox-deployment/src/manifest_ingress.rs", "crates/paraegox-deployment/src/controller_journal.rs", "crates/paraegox-deployment/src/controller_store.rs", "crates/paraegox-deployment/src/controller_initializer.rs", "crates/paraegox-deployment/src/controller_tenure.rs", "crates/paraegox-deployment/src/deployment_process.rs", "crates/paraegox-deployment/src/tenure_protocol.rs", "crates/paraegox-deployment/src/tenure_client.rs", "crates/paraegox-deployment/src/tenure_authority/mod.rs", "crates/paraegox-deployment/src/tenure_authority_process.rs", "tests/governance/test_s7_pure_compile_boundary.py", "tests/governance/test_s7_tenure_authority_boundary.py", "tests/system/test_s7_tenure_authority_process.py", "tests/system/test_s7_deployment_process.py"]
removal_condition = "Remove only after an admitted successor preserves the one-writer Authority epoch/proof journal, Controller manifest pin and plan/tenure transactions, exact operation replay, key and service-principal isolation, both strict process facades, and the existing pure projection/compiler consumers without introducing a second authority, state owner, or hand-written Runtime Slice path."

[[registry.public_apis]]
module = "paraegox_deployment"
symbols = ["run_tenure_authority_process", "TenureAuthorityProcessError", "run_deploymentd_process", "DeploymentdProcessError"]
owner = "Deployment process composition roots"
consumers = ["paraegox-tenure-authority", "paraegox-deploymentd"]
compatibility = "The public Rust surface is limited to starting either exact process facade and receiving an opaque fail-closed error. The tenure-authority process and deploymentd acquire client communicate over a real strict versioned wire, while its Rust DTOs remain owner-private. The one-shot deploymentd accepts only the exact positional grammars `initialize-reference-v1`, `commit-reference-loop-v1`, `commit-reference-empty-v1`, `acquire-tenure-v1`, `bootstrap-runtime-v1`, and `apply-reference-v1`; none accepts an implicit fallback, environment override, retry loop, or caller-supplied request entropy. Initialization pins the installer manifest, Loop and Empty commands commit only their admitted plan transitions, tenure and bootstrap pin their authenticated authority domains, and apply exposes only a commit-before-send PXAR followed by an exact validated PXRT or a fail-closed error. These facades do not expose journal, Planner, tenure, request, wire, or store DTOs and provide no Runtime query, restart reassembly/recovery, Controller reconcile loop, daemon semantics, general workload admission, or wider deployment profile. Incompatible command, receipt, or ownership semantics require a new explicit version."
tests = ["crates/paraegox-deployment/src/tenure_authority_process.rs", "crates/paraegox-deployment/src/deployment_process.rs", "tests/governance/test_s7_tenure_authority_boundary.py", "tests/system/test_s7_tenure_authority_process.py", "tests/system/test_s7_deployment_process.py"]

