[[registry.packages]]
path = "crates/paraegox-runtime-host"
cargo_package = "paraegox-runtime-host"
owner = "Final RuntimeHost executable build and external service-manager adapter owner"
responsibility = "Final executable composition root for the single RuntimeHost reactor and S7-E release/install/control commands, plus the separate POSIX reference OS service-manager adapter. Its build script is the sole final-artifact build-identity producer: it obtains a nonzero build instance ID from the OS CSPRNG, captures Cargo's canonical target triple, tracks the complete in-workspace final-artifact dependency closure, and emits generated source only into OUT_DIR. Main embeds those facts in the final executable and passes them directly to the Runtime entrypoint; no environment, operator argument, descriptor, or journal may replace them at runtime. No arguments preserves the existing RuntimeHost reactor; exact versioned commands produce the descriptor, verify/install the root-owned executable and singleton manifest into the sequence-one Runtime store, or serve the authenticated local bootstrap/apply endpoint owned by the Runtime crate. The separate service-manager adapter remains the exclusive owner of its exact RuntimeHost child/process group, PXHW observations, bounded restart/backoff ledger, TERM/KILL/reap actions, and quarantine mutation, with its existing same-group-descendant and independently grouped ProcessDomain limitations. This package creates no NodeDaemon, Node facts, Deployment authority, Runtime query/reconcile owner, DeploymentController/deploymentd, Fabric, second restart loop, or general installer framework."
status = "experimental"
public_entrypoints = ["paraegox_runtime_host::service_manager", "paraegox-runtime-host release-descriptor-v1/install-v1/serve-bootstrap-v1 CLI"]
consumers = ["Runtime release pipeline", "system installer/operator"]
first_tests = ["crates/paraegox-runtime-host/build.rs", "crates/paraegox-runtime-host/src/main.rs", "crates/paraegox-runtime/src/runtime_host_entrypoint.rs", "crates/paraegox-runtime/src/runtime_artifact.rs", "crates/paraegox-runtime/src/runtime_build_metadata.rs", "crates/paraegox-runtime/src/runtime_initializer.rs", "crates/paraegox-runtime/src/runtime_install_files.rs", "crates/paraegox-runtime-host/src/service_manager.rs", "crates/paraegox-runtime-host/tests/external_watchdog.rs", "tests/system/test_s7_runtime_install_process.py"]
