endpoint, Controller producer, restart reassembly, Fabric session, credential resolver, TLS handshake, or general service graph. Deployment and Runtime consume the contracts without introducing a second codec. Executable observations and independently compiled facts can generate the one descriptor, the installer can generate the one manifest without accepting manifest input, and Runtime initialization can strictly reverify both exact artifacts. Desired Process profile references still do not enforce a sandbox or launch an OS process, and this package creates neither installer filesystem/process authority nor control-plane transport authority."
