[[registry.packages]]
path = "crates/paraegox-runtime-contracts"
cargo_package = "paraegox-runtime-contracts"
owner = "Runtime contract owner"
responsibility = "Source-plan provenance, canonical PXTA binding assignments, canonical PXTE v1 Loop, additive PXTE v2 Loop+Thread, additive PXTE v3 Loop+Thread+Process, narrow reference PXTE v4/PXAR v5 assignments, composite target digests, complete Runtime apply requests, strict PXWP v1 worker-session framing, apply-control commitments, writer-tenure signing and fingerprints, temporal constraints, and the canonical signed apply-envelope wire contracts. S7-E publicly exposes the strict installation seam around the existing canonical Runtime build descriptor and singleton compatibility manifest owners plus a narrow `reference_control` facade over the already canonical reference request, bootstrap, lifecycle, profile, and key-fingerprint owners. Deployment and Runtime consume that facade without introducing a second codec. Executable observations and independently compiled facts can generate the one descriptor, the installer can generate the one manifest without accepting manifest input, and Runtime initialization can strictly reverify both exact artifacts. Desired Process profile references still do not enforce a sandbox or launch an OS process, and this package creates neither installer filesystem/process authority nor control-plane transport authority."
status = "public"
public_entrypoints = ["paraegox_runtime_contracts::assignment", "paraegox_runtime_contracts::execution", "paraegox_runtime_contracts::thread_execution", "paraegox_runtime_contracts::process_execution", "paraegox_runtime_contracts::process_protocol", "paraegox_runtime_contracts::provenance", "paraegox_runtime_contracts::apply", "paraegox_runtime_contracts::temporal", "paraegox_runtime_contracts::wire", "paraegox_runtime_contracts::installation", "paraegox_runtime_contracts::reference_control"]
