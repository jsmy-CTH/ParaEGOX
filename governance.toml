schema_version = 1

[repository]
source_root = "src/paraegox"
term_scan_roots = ["src", "crates", "configs"]
exception_scan_roots = ["src", "crates", "tests", "scripts", ".github"]
documentation_roots = ["README.md", "README_zh.md"]
untracked_only_roots = ["docs"]
allowed_top_level_directories = [".github", "configs", "crates", "docs", "scripts", "src", "tests"]
ignored_top_level_directories = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "__pycache__", "build", "dist", "target"]

[registry]
# Do not add placeholders. Add rows only in the same change that creates the real surface.
deprecations = []
feature_flags = []

[[registry.waivers]]
id = "GOV-WAIVER-0001"
rule_id = "rust:expect"
scope = "crates/paraegox-runtime/src/lib.rs"
owner = "Runtime apply, installation, and state owner"
reason = "Keep the admitted B2/P2a state mechanisms, S4/P2b Loop composition, S5/P2c ThreadDomain/ExecutorBudget composition, the S6/P2d local POSIX ProcessDomain baseline, fixed two-CoreService lifecycle evidence, and the remaining owner-private S7-E Runtime journal/startup/control mechanisms private behind the exact RuntimeHost entrypoint. S7-E now consumes artifact observation, installation verification, sequence-one initialization, store preflight, install-file publication, authenticated bootstrap, and canonical PXAR apply through the real RuntimeHost executable path. The remaining expectations cover internal DTOs and the still-absent Runtime query, production restart reassembly/recovery, and general Runtime assembly capabilities; they do not claim that the executable bootstrap/apply vertical is absent. Remove or narrow the remaining expectations as each real executable consumer replaces them."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0002"
rule_id = "rust:expect"
scope = "crates/paraegox-deployment/src/lib.rs"
owner = "Deployment planning, tenure, projection, and apply-envelope owner"
reason = "Keep owner-internal Deck, plan, journal, tenure, projection, canonical-request, and wire types private behind the two exact process facades. S7-E now has exact one-shot deploymentd consumers for installer-manifest ingress, DeckCompiler/Planner, durable Loop and Empty plan commits, the authenticated Controller-to-Authority tenure exchange, Runtime bootstrap, and PXAR apply/PXRT persistence. Those cross-process wires are executable while their Rust DTOs remain owner-private. The remaining expectations cover internal types and the still-absent Runtime query, Controller reconciliation, production restart reassembly/recovery, general workload admission, and wider deployment profiles. Remove or narrow each expectation only when a real executable consumer requires a public surface without exposing mutable state."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0003"
rule_id = "pytest:skip"
scope = "tests/system/test_s6_python_reference_worker.py"
owner = "ProcessDomain reference worker and system evidence owner"
reason = "The S6 reference-worker system harness deliberately exercises POSIX process groups, Unix signals, and descriptor semantics. Keep the explicit non-POSIX skip until a separately admitted platform backend and equivalent cleanup harness exist; this waiver does not skip any supported POSIX profile."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0004"
rule_id = "rust:ignore"
scope = "crates/paraegox-runtime/src/process_domain.rs"
owner = "Runtime ProcessDomain cross-language evidence owner"
reason = "Only the exact python_reference_worker_round_trips_through_rust_process_domain test is ignored by the Rust-only job because it requires the uv-managed interpreter; the uv CI job executes it explicitly. Remove this split-run exception when the P2e production Artifact runner or an independent cross-language suite becomes the sole owner of equivalent Rust-host/Python-worker evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0005"
rule_id = "rust:ignore"
scope = "crates/paraegox-runtime/src/process_domain.rs"
owner = "Runtime ProcessDomain native-worker system evidence owner"
reason = "Only the exact rust_reference_worker_faults_preserve_uncertain_ownership_and_cleanup test is ignored by the default library test because it consumes the separately built reference-worker executable by absolute path. CI builds that executable and runs this test explicitly; remove the split-run exception when P2e provides the production Artifact runner and equivalent end-to-end evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0006"
rule_id = "pytest:skip"
scope = "tests/system/test_s7_tenure_authority_process.py"
owner = "Deployment tenure-authority POSIX system evidence owner"
reason = "The S7-D Authority harness deliberately exercises Unix peer credentials, owner/group/mode ACLs, Unix-domain sockets, signals, advisory descriptor locks, and stale-socket recovery. Keep the explicit non-POSIX skip until a separately admitted platform authority backend has equivalent credential, locking, commit-before-reply, and crash-recovery evidence; this waiver does not skip any supported POSIX reference profile."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0007"
rule_id = "pytest:skip"
scope = "tests/system/test_s7_tenure_authority_process.py"
owner = "Deployment tenure-authority service-account isolation evidence owner"
reason = "The real successful acquire/replay/crash-recovery and wrong-peer store scenarios require the exact Linux ext4 production state-store profile; the former also switches the Authority binary to a distinct non-root OS account while the test client remains the Controller peer. GitHub's Linux reference runner provides non-interactive sudo and executes both evidence paths. macOS APFS remains fail-closed because mode bits cannot prove the absence of inherited extended ACLs and the workspace has no admitted FD-anchored ACL backend; local macOS retains pure functional, argument, and unsafe-configuration evidence only. Remove or narrow this platform split after PC1 admits APFS extended-ACL, durability, and dedicated non-interactive service-account evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0008"
rule_id = "pytest:skip"
scope = "tests/system/test_s7_runtime_install_process.py"
owner = "RuntimeHost release/install production-profile system evidence owner"
reason = "The successful end-to-end S7-E Runtime install scenario requires the exact Linux ext4 Runtime store profile, non-interactive sudo to provision a root:root mode-0555 installed RuntimeHost executable, and execution under a distinct non-root service identity. macOS APFS and non-Linux hosts remain fail-closed and may run only non-production argument and rejection evidence; they must not turn this skip into a support claim. Remove or narrow the split after PC1 admits FD-anchored APFS extended-ACL, durability, launchd/service-identity evidence and PC2 independently admits the corresponding Windows backend evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0009"
rule_id = "pytest:skip"
scope = "tests/system/test_s7_deployment_process.py"
owner = "DeploymentController production-profile process evidence owner"
reason = "The Linux-only S7-E DeploymentController harness requires exact ext4 Runtime, Controller, and Authority stores plus non-interactive sudo. It provisions root:root mode-0555 RuntimeHost, deploymentd, and tenure-authority executables and three distinct non-root Runtime, Controller, and Authority service accounts, with setgid socket directories, mode-0660 sockets, and Unix peer-credential checks. Its current source exercises initialize, Loop commit, authenticated bootstrap and tenure, Loop apply, Empty commit/apply, terminal replay, and fail-closed no-mutation branches, but this expanded tranche has not yet been verified by an Ubuntu CI run. macOS APFS and non-Linux hosts remain fail-closed and may run only non-production argument, parser, and pure state-transition evidence; they must not turn this skip into a support claim. Remove or narrow the split after PC1 admits FD-anchored APFS extended-ACL, durability, launchd/service-identity evidence and PC2 independently admits the corresponding Windows backend evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0010"
rule_id = "rust:allow"
scope = "crates/paraegox-runtime-contracts/src/reference_*.rs"
owner = "Canonical reference-control contract owner"
reason = "The canonical terminal Receipt constructor, signing transcript, and strict wire encoder intentionally preserve the one fixed protocol field order in one place; grouping those fields would introduce a second protocol DTO or obscure review of byte order. Keep this narrow lint exception until a contract-version migration can replace the field list atomically across producer, verifier, and frozen-wire evidence."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0011"
rule_id = "rust:allow"
scope = "crates/paraegox-deployment/src/controller_*.rs"
owner = "DeploymentController bootstrap and apply provisioning owner"
reason = "The sealed fixed-profile provisioning constructors require independently validated identity, manifest, endpoint, key, and lifecycle facts at their trust boundary. Keep this narrow argument-count exception while the executable vertical is integrated; remove it only if a replacement value object preserves validation ownership without exposing caller-constructible protocol state."
expires_at = "2026-09-30"

[[registry.waivers]]
id = "GOV-WAIVER-0012"
rule_id = "rust:allow"
scope = "crates/paraegox-runtime/src/runtime_control_state.rs"
owner = "Runtime control-state and apply owner"
reason = "The private apply child module remains colocated with the control-state owner during S7-E endpoint integration, and one fixed test helper names the full expected request boundary. Remove the dead-code exception when the production endpoint is the sole module owner and replace the test-helper exception when a sealed fixture can preserve the same independent field coverage."
expires_at = "2026-09-30"

