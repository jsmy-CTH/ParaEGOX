[project]
name = "paraegox-sdk"
version = "0.0.0"
description = "ParaEGOX Python governance tooling, typed Textual console, and managed-workload SDK"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.2.1,<9",
]

[project.scripts]
paraegox-console = "paraegox_sdk.console_tui:main"
paraegox-worker = "paraegox_sdk.worker.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "cryptography>=46.0.7,<47",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = true
default-groups = ["dev"]
required-version = "==0.11.32"

[tool.uv.build-backend]
module-name = "paraegox_sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
