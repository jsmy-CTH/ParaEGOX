name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Report active Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all --check
      - name: Resolve locked workspace metadata
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --locked

  governance-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install repository-pinned Rust toolchain for governance
        run: rustup toolchain install --no-self-update
      - name: Rebuild locked development environment
        run: uv sync --locked
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Governance fitness checks
        run: uv run --frozen python scripts/check_governance.py
      - name: Tests
        run: uv run --frozen pytest
