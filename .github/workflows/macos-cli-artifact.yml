name: macos-cli-artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "build/macos-artifact-*"

permissions:
  contents: read

jobs:
  build-paraegox-cli:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Report active Rust toolchain
        run: rustup show active-toolchain

      - name: Install repository-pinned uv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/paraegox-uv-bootstrap"
          "$RUNNER_TEMP/paraegox-uv-bootstrap/bin/python" -m pip install \
            --disable-pip-version-check \
            'uv==0.11.32'
          printf '%s\n' "$RUNNER_TEMP/paraegox-uv-bootstrap/bin" >> "$GITHUB_PATH"

      - name: Prepare locked Python environment
        run: uv sync --locked

      - name: Verify Textual client and internal entrypoint
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check \
            src/paraegox_sdk/console_client.py \
            src/paraegox_sdk/console_tui.py \
            tests/console \
            scripts/smoke_macos_textual_chat.py
          uv run --frozen pytest tests/console -q
          uv run --frozen paraegox-console --help

      - name: Build the ParaEGOX CLI
        run: cargo build --locked -p paraegox-local --bin paraegox

      - name: Verify native binary and public CLI
        shell: bash
        run: |
          set -euo pipefail

          binary="target/debug/paraegox"
          test -x "$binary"

          binary_description="$(file -b "$binary")"
          printf '%s\n' "$binary_description"
          case "$binary_description" in
            "Mach-O 64-bit executable x86_64"*) ;;
            *)
              printf 'unexpected ParaEGOX artifact: %s\n' "$binary_description" >&2
              exit 1
              ;;
          esac

          help_output="$RUNNER_TEMP/paraegox-help.txt"
          "$binary" --help | tee "$help_output"

          grep -Fqx 'Usage: paraegox chat --config <absolute-paraegox.toml>' "$help_output"
          grep -Fqx '       paraegox --help' "$help_output"
          test "$(grep -Ec '^(Usage: paraegox|       paraegox)' "$help_output")" -eq 2

          if grep -Eq 'paraegox-local|developer-|fixture-v1|openai-v1|deepseek-v1' "$help_output"; then
            printf 'legacy provider-specific CLI surface is still exposed\n' >&2
            exit 1
          fi

      - name: Stage relocatable CLI and Textual bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact
          install -m 0755 target/debug/paraegox artifact/paraegox
          uv pip install --target artifact/python --no-compile .
          if [ -d artifact/python/bin ]; then
            for generated_script in artifact/python/bin/*; do
              [ -e "$generated_script" ] || continue
              test -f "$generated_script"
              test ! -L "$generated_script"
              rm -- "$generated_script"
            done
            rmdir artifact/python/bin
          fi
          if [ -e artifact/python/.lock ]; then
            test -f artifact/python/.lock
            test ! -L artifact/python/.lock
            rm artifact/python/.lock
          fi
          install -m 0755 scripts/paraegox-console artifact/paraegox-console

          test "$(head -n 1 artifact/paraegox-console)" = '#!/usr/bin/env sh'
          test -f artifact/python/paraegox_sdk/console_tui.py
          test -f artifact/python/paraegox_sdk/console_client.py
          if grep -RIlE '^#!.*(/Users/runner|/_temp/|/home/runner)' artifact; then
            printf 'bundle contains a CI-absolute shebang\n' >&2
            exit 1
          fi

      - name: Smoke relocated parent, Textual child, and Rust Agent IPC
        shell: bash
        run: |
          set -euo pipefail

          relocated_bundle="$RUNNER_TEMP/ParaEGOX bundle"
          cp -R artifact "$relocated_bundle"
          smoke_python_prefix="$(.venv/bin/python3 -c 'import sys; print(sys.base_prefix)')"
          smoke_python="$smoke_python_prefix/bin/python3"
          test -x "$smoke_python"
          if "$smoke_python" -I -c 'import textual' >/dev/null 2>&1; then
            printf 'smoke interpreter unexpectedly contains Textual outside the bundle\n' >&2
            exit 1
          fi
          PATH="$smoke_python_prefix/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "$smoke_python" scripts/smoke_macos_textual_chat.py \
              --bundle-dir "$relocated_bundle"

      - name: Checksum the complete bundle
        shell: bash
        run: |
          set -euo pipefail

          (
            cd artifact
            find . -type f ! -name SHA256SUMS -print \
              | LC_ALL=C sort \
              | while IFS= read -r path; do shasum -a 256 "$path"; done \
              > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Upload commit-addressed macOS chat bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: paraegox-macos-x86_64-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
